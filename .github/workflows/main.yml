name: Fetch page and save

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL of the page to download"
        required: true
        type: string

jobs:
  fetch_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pages directory and download page
        id: download_page # شناسه برای ارجاع به این step
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          echo "Creating directory 'pages'..."
          mkdir -p pages
          echo "Directory 'pages' created."

          echo "Downloading page from: $TARGET_URL"
          curl -L -sS "$TARGET_URL" -o "pages/index.html"
          echo "Page downloaded to pages/index.html."

          # بررسی اینکه آیا فایل با موفقیت دانلود شده است
          if [ ! -f "pages/index.html" ]; then
            echo "Error: Failed to download the page or file was not created."
            exit 1
          fi
          echo "File check successful."

      - name: Commit and push changes
        run: |
          echo "Checking for changes..."
          # Use git status --porcelain to get a stable output for checking changes
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit. Skipping push."
            exit 0
          fi

          echo "Configuring Git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Adding downloaded file to Git..."
          git add pages/index.html

          echo "Committing changes..."
          git commit -m "Automated fetch of ${{ inputs.target_url }}"

          echo "Pushing changes..."
          # Use the default GITHUB_TOKEN for pushing
          git push origin HEAD:${{ github.ref_name }}
          echo "Changes pushed successfully."
        env:
          # Ensure GITHUB_TOKEN is available
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
