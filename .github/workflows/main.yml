name: Fetch page to pages/ (simple .html v2)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL of the page to download"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create pages directory and download page
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          echo "Creating directory 'pages'..."
          mkdir -p pages
          echo "Directory 'pages' created."

          echo "Downloading page from: $TARGET_URL"
          # Use curl to download the page and save it as index.html in the pages directory
          curl -L -sS "$TARGET_URL" -o "pages/index.html"
          echo "Page downloaded successfully to pages/index.html."

      - name: Commit and push the downloaded file
        run: |
          # Check if there are any changes to commit
          if [[ -z $(git status -s) ]]; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          echo "Configuring Git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git user configured."

          echo "Adding pages/index.html to Git..."
          git add pages/index.html
          echo "File added."

          echo "Committing changes..."
          git commit -m "Fetched page from ${{ inputs.target_url }}"
          echo "Changes committed."

          echo "Pushing changes to repository..."
          git push
          echo "Changes pushed successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
